<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Quiz</title>
<style>body{font-family:Arial;background:#f3f0ff;margin:0;padding:15px}h1{color:#6a1b9a} .card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px #ddd} button{background:#6a1b9a;color:white;border:none;padding:10px 15px;border-radius:8px;margin:5px 0;width:100%;text-align:left;font-size:15px} a{color:#6a1b9a}</style>
</head><body>
<a href="dashboard.html">← Back to Dashboard</a>
<h1>❓ Quick Quiz</h1>
<p>answer each question and check your score instantly!</p>
<div id="box" class="card"></div>
<div id="result"></div>
<script src="js/data.js"></script>
<script>
let i=0, score=0;
function showQ(){
  if(i>=QUIZ.length){
    document.getElementById("box").innerHTML = `<h2>completed! 🎉</h2><p>your score: ${score} / ${QUIZ.length}</p><p><a href="progress.html">view progress →</a></p>`;
    localStorage.setItem("lastQuizScore", score + "/" + QUIZ.length);
    localStorage.setItem("quizTotal", QUIZ.length);
    localStorage.setItem("quizScore", score);
    return;
  }
  let q = QUIZ[i];
  let btns = "";
  q.options.forEach((op, idx)=>{ btns += `<button onclick="check(${idx})">${op}</button><br>`; });
  document.getElementById("box").innerHTML = `<h3>Q${i+1}. ${q.q}</h3>${btns}`;
}
function check(idx){
  if(idx === QUIZ[i].answer){ score++; document.getElementById("result").innerHTML = "<b style='color:green'>✅correct!</b>"; }
  else { document.getElementById("result").innerHTML = "<b style='color:red'>❌ wrong! correct answer: "+QUIZ[i].options[QUIZ[i].answer]+"</b>"; }
  i++;
  setTimeout(()=>{ document.getElementById("result").innerHTML=""; showQ(); }, 1200);
}
showQ();
</script><div class="card" style="background:white;padding:15px;border-radius:12px;margin:10px 0">
<input id="apiKey" type="password" placeholder="Paste API Key (first time only)" style="padding:11px;width:100%;border-radius:8px;border:1px solid #ccc;margin:5px 0;box-sizing:border-box">
<input id="topic" placeholder="Enter topic - e.g. Science" style="padding:11px;width:100%;border-radius:8px;border:1px solid #ccc;margin:5px 0;box-sizing:border-box">
<button onclick="makeQuiz()" style="padding:11px;width:100%;background:#6a1b9a;color:white;border:none;border-radius:8px;font-weight:bold">✨ Generate Quiz with AI</button>
</div>
<div id="box" style="background:white;padding:15px;border-radius:12px">Your Quiz will appear here...</div>

<script>
let savedKey = localStorage.getItem("geminiApiKey") || localStorage.getItem("apiKey") || "";
if(savedKey) document.getElementById("apiKey").value = savedKey;
let saved = localStorage.getItem("aiQuiz");
if(saved) document.getElementById("box").innerHTML = saved.replace(/\n/g,"<br>");

async function makeQuiz(){
  let topic = document.getElementById("topic").value || "General";
  let key = document.getElementById("apiKey").value.trim();
  if(!key){ alert("Paste API Key first"); return; }
  localStorage.setItem("geminiApiKey", key);
  localStorage.setItem("apiKey", key);
  document.getElementById("box").innerHTML = "Generating... Please wait...";
  try{
    let res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+key, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({contents:[{parts:[{text:"Create 5 easy quiz questions in simple English on "+topic+". Give Question, 4 options A B C D, and Correct Answer."}]}]})});
    let data = await res.json();
    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error: Check Key. " + JSON.stringify(data).slice(0,200);
    document.getElementById("box").innerHTML = text.replace(/\n/g,"<br>");
    localStorage.setItem("aiQuiz", text);
  }catch(e){ document.getElementById("box").innerHTML = "Error: " + e.message; }
}
</script>
  
</body></html>
