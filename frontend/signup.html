<!DOCTYPE html><html><head><title>Signup - StudySync</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:white;padding:35px;border-radius:20px;width:380px;box-shadow:0 15px 40px rgba(0,0,0,0.3)}
h2{text-align:center;color:#667eea;margin-bottom:20px} input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:10px}
.btn{width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px}
a{color:#667eea;text-decoration:none;font-weight:600}
</style></head><body>
<div class="box"><h2>Join StudySync ✨</h2>
<input id="name" placeholder="Full Name"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password (min 6)">
<button class="btn" onclick="signup()">Create Account</button>
<p style="text-align:center;margin-top:15px">Already have? <a href="login.html">Login</a></p>
</div><script src="js/auth.js"></script></body></html>
