<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Progress</title>
<style>body{font-family:Arial;background:#f3f0ff;margin:0;padding:15px}h1{color:#6a1b9a} .card{background:white;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px #ddd} .bar{background:#eee;height:18px;border-radius:10px;overflow:hidden} .fill{background:#6a1b9a;height:18px} a{color:#6a1b9a}</style>
</head><body>
<a href="dashboard.html">← Back to Dashboard</a>
<h1>📊my progress</h1>
<p>track your time table and quizz performance</p>
<div class="card"><h3>Time Table Progress</h3><div id="timeText"></div><div class="bar"><div class="fill" id="timeBar"></div></div></div>
<div class="card"><h3>Quiz Progress</h3><div id="quizText"></div><div class="bar"><div class="fill" id="quizBar"></div></div></div>
<div class="card"><h3>📅 Next Week Plan</h3><div id="plan"></div></div>
<div class="card"><h3>Weak Topics</h3><div id="weak"></div></div>
<script src="js/data.js"></script>
<script>
let done = JSON.parse(localStorage.getItem("doneDays") || "[]");
let timePer = Math.round((done.length / TIMETABLE.length) * 100);
document.getElementById("timeText").innerText = done.length + " / " + TIMETABLE.length + " Days Complete - " + timePer + "%";
document.getElementById("timeBar").style.width = timePer + "%";

let qs = parseInt(localStorage.getItem("quizScore") || "0");
let qt = parseInt(localStorage.getItem("quizTotal") || "5");
let quizPer = qt>0 ? Math.round((qs/qt)*100) : 0;
document.getElementById("quizText").innerText = "Last Quiz Score: " + qs + " / " + qt + " - " + quizPer + "%";
document.getElementById("quizBar").style.width = quizPer + "%";

if(quizPer >= 80){ document.getElementById("plan").innerHTML = "Mon-Wed: New Topics<br>Thu-Fri: Mock Test<br>Sat-Sun: Revision"; document.getElementById("weak").innerHTML = "🎉no weak topics!you are doing good!"; }
else if(quizPer >= 50){ document.getElementById("plan").innerHTML = "Mon-Wed: Maths + Science Revision<br>Thu-Fri: Quiz Practice<br>Sat: Mock, Sun: Full Revision"; document.getElementById("weak").innerHTML = "⚠️ Maths -practice a little more"; }
else { document.getElementById("plan").innerHTML = "mon-wed: basics from scratch<br>Thu-Fri: Easy Quiz<br>Sat-Sun: Revision + Notes"; document.getElementById("weak").innerHTML = "⚠️ maths+science-focus on basics"; }
if(!localStorage.getItem("quizScore")){ document.getElementById("weak").innerHTML = "take the quick quiz first,then your report will appear here!"; }
</script>
</body></html>
